<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="在本机核对 SRT 和 WebVTT 字幕的时间覆盖。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>CueProof · 字幕交付检查</title>
  <style>:root {
  color-scheme: dark;
  font-family: system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #0d1422;
  color: #eef1f8;
  --panel: #151f30;
  --surface: #0f1827;
  --line: #334159;
  --muted: #a9b6cb;
  --accent: #81e5d2;
  --missing: #ffc190;
}

* { box-sizing: border-box; }
body { margin: 0; }
.workspace { width: min(100%, 1100px); margin: auto; padding: 0 33px 28px; }
.masthead, .hero, .report-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
.masthead { min-height: 68px; border-bottom: 1px solid var(--line); }
.masthead strong { font-size: 1.23rem; letter-spacing: -.04em; }
.masthead span { color: var(--muted); font-size: .83rem; }
.masthead i { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--accent); }
.hero { padding: 36px 0 28px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.85rem); line-height: 1.12; letter-spacing: -.055em; margin-bottom: 9px; }
h2 { font-size: 1.2rem; }
.hero p { max-width: 590px; color: var(--muted); line-height: 1.6; }
.panel { padding: 23px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.files { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 13px; margin: 15px 0; }
.file { display: grid; gap: 8px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; font-weight: 650; }
.file input { width: 100%; font: inherit; font-weight: normal; font-size: .86rem; color: var(--muted); }
.file input::file-selector-button { cursor: pointer; font: inherit; padding: 5px 8px; margin-right: 8px; }
.actions { display: flex; align-items: end; flex-wrap: wrap; gap: 11px 17px; }
.actions label { display: grid; gap: 5px; font-size: .86rem; }
input[type=number] { font: inherit; height: 40px; width: 136px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; }
button { min-height: 40px; font: inherit; font-weight: 650; white-space: nowrap; padding: 7px 13px; border: 1px solid var(--line); border-radius: 7px; color: inherit; cursor: pointer; }
button:hover:not(:disabled) { filter: brightness(1.16); }
button:disabled { opacity: .6; cursor: wait; }
.primary { background: var(--accent); color: #0b2828; border-color: var(--accent); }
.secondary { background: #202e46; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.hint { margin-top: 11px; font-size: .82rem; color: var(--muted); line-height: 1.55; }
.status:not(:empty) { margin-top: 12px; }
.status[data-error=true], .errors { color: var(--missing); }
.errors { padding-left: 20px; }
.errors li + li { margin-top: 4px; }
.report { margin-top: 15px; }
.metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.metrics div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.metrics dt { color: var(--muted); font-size: .89rem; }
.metrics dd { margin: 4px 0 0; font-size: clamp(1rem, 3vw, 1.48rem); font-variant-numeric: tabular-nums; font-weight: 700; }
.track-row { display: grid; grid-template-columns: 65px minmax(0, 1fr); align-items: center; gap: 8px; margin: 9px 0; font-size: .86rem; }
.track { display: block; width: 100%; height: 14px; border-radius: 3px; background: #2b3850; }
.scale { display: flex; justify-content: space-between; margin-left: 73px; color: var(--muted); font: .78rem ui-monospace, monospace; }
.table-wrap { margin-top: 12px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .9rem; white-space: nowrap; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-size: .83rem; }
td { font-variant-numeric: tabular-nums; }
.missing td:first-child { color: var(--missing); }
.extra td:first-child { color: #a9bafe; }
#more:not([hidden]) { margin-top: 12px; }
footer { margin-top: 20px; color: var(--muted); font-size: .82rem; line-height: 1.6; }

@media (max-width: 610px) {
  .workspace { padding-inline: 15px; }
  .hero { flex-direction: column; align-items: start; padding: 26px 0 20px; gap: 12px; }
  .files { grid-template-columns: 1fr; gap: 7px; }
  .panel { padding: 15px; }
  .metrics { gap: 5px; }
  .metrics div { padding: 8px 5px; }
  .metrics dt { font-size: .76rem; }
  th, td { padding-inline: 7px; }
}
</style>
</head>
<body>
  <main class="workspace">
    <header class="masthead">
      <strong>CueProof</strong>
      <span>在本机处理字幕 <i aria-hidden="true"></i></span>
    </header>
    <section class="hero" aria-labelledby="title">
      <div>
        <h1 id="title">字幕交付检查</h1>
        <p>对比原稿和待交付字幕，找出哪些播放时段缺少字幕、哪些时段多出字幕。</p>
      </div>
      <button id="sample" class="secondary" type="button">试用样例 <span aria-hidden="true">↗</span></button>
    </section>
    <section class="panel" aria-labelledby="input-title">
      <h2 id="input-title">选择字幕</h2>
      <div class="files">
        <label class="file"><span>原稿</span><input id="source" type="file" accept=".srt,.vtt,text/vtt"></label>
        <label class="file"><span>待交付字幕</span><input id="delivery" type="file" accept=".srt,.vtt,text/vtt"></label>
      </div>
      <div class="actions">
        <label>最短提示（毫秒） <input id="minimum" type="number" min="0" max="10000" step="1" value="250"></label>
        <label>交付稿偏移（毫秒） <input id="offset" type="number" min="-600000" max="600000" step="1" value="0" aria-describedby="offset-help"></label>
        <button id="compare" class="primary" type="button">开始核对</button>
      </div>
      <p class="hint" id="offset-help">支持 SRT 和 WebVTT。偏移为正时，交付稿在预览中向后移。</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <ul id="errors" class="errors" hidden></ul>
    </section>
    <section id="report" class="panel report" aria-labelledby="result-title" tabindex="-1" hidden>
      <div class="report-head">
        <h2 id="result-title">核对结果</h2>
        <button id="download" type="button" class="secondary">下载 CSV</button>
      </div>
      <dl class="metrics">
        <div><dt>原稿覆盖率</dt><dd id="covered"></dd></div>
        <div><dt>缺少覆盖</dt><dd id="missing"></dd></div>
        <div><dt>多出覆盖</dt><dd id="extra"></dd></div>
      </dl>
      <div class="timeline" aria-label="字幕时间覆盖条">
        <div class="track-row"><span>原稿</span><canvas id="source-track" class="track" width="1200" height="20"></canvas></div>
        <div class="track-row"><span>交付稿</span><canvas id="delivery-track" class="track" width="1200" height="20"></canvas></div>
        <div class="scale"><span>00:00</span><span id="track-end"></span></div>
      </div>
      <p id="threshold" class="hint"></p>
      <div class="table-wrap">
        <table aria-label="覆盖差异时间段">
          <thead><tr><th>类别</th><th>开始</th><th>结束</th><th>时长</th></tr></thead>
          <tbody id="findings"></tbody>
        </table>
      </div>
      <button id="more" class="secondary" type="button" hidden>显示更多</button>
    </section>
    <footer>仅检查时间覆盖。字幕译文、音画同步和原文件内容仍需人工核对。</footer>
  </main>
  <script>'use strict';

const CueProof = (() => {
  function milliseconds(text, vtt) {
    const match = /^(?:(\d{2,}):)?([0-5]\d):([0-5]\d)([.,])(\d{3})$/.exec(text);
    if (!match || (vtt ? match[4] !== '.' : !match[1])) return null;
    const value = (+match[1] || 0) * 3600000 + +match[2] * 60000 + +match[3] * 1000 + +match[5];
    return Number.isSafeInteger(value) && value <= 3599999999 ? value : null;
  }

  function parse(input) {
    const lines = input.replace(/^\uFEFF/, '').split(/\r\n|\r|\n/);
    const vtt = /^WEBVTT(?:[\t ].*)?$/.test(lines[0]);
    if (vtt && lines[0].includes('-->')) throw new Error('WebVTT header cannot contain a cue.');
    const cues = [];
    const errors = [];
    const timingPattern = /^([^\s]+)[\t ]+-->[\t ]+([^\s]+)(?:[\t ]+([^\n]+))?$/;
    let index = 0;
    if (vtt) {
      while (index < lines.length && lines[index].trim()) {
        if (index > 0 && lines[index].includes('-->')) {
          throw new Error('Add a blank line after the WebVTT header.');
        }
        index++;
      }
    }
    while (index < lines.length) {
      if (!lines[index].trim()) { index++; continue; }
      const startLine = index;
      while (index < lines.length && lines[index].trim()) index++;
      const block = lines.slice(startLine, index);
      if (vtt && /^(?:NOTE(?:[\t ]|$)|STYLE$|REGION$)/.test(block[0].trim())) continue;
      const hasIdentifier = vtt ? !block[0].includes('-->') : /^\d+$/.test(block[0].trim());
      const timingIndex = Number(hasIdentifier);
      const line = startLine + timingIndex + 1;
      const timing = timingPattern.exec(block[timingIndex]?.trim() ?? '');
      const start = timing ? milliseconds(timing[1], vtt) : null;
      const end = timing ? milliseconds(timing[2], vtt) : null;
      if (start === null || end === null || end <= start || (!vtt && timing?.[3])) {
        errors.push({ line: Math.min(line, startLine + block.length), message: 'Invalid or reversed cue time. Check the timestamp format and order.' });
        continue;
      }
      const payload = block.slice(timingIndex + 1);
      if (payload.some(row => timingPattern.test(row.trim()) && /^\d/.test(row.trim()))) {
        errors.push({ line, message: 'More than one timestamp in this block. Separate cues with a blank line.' });
        continue;
      }
      const text = payload.join(' ').replace(/<[^>]+>/g, '').replace(/&(?:nbsp|lrm|rlm|zwnj|zwj);/g, '');
      if (/[\S]/u.test(text.replace(/[\u200b-\u200f\u202a-\u202e\u2060\u2066-\u2069]/g, ''))) {
        cues.push({ start, end });
      }
    }
    return { format: vtt ? 'VTT' : 'SRT', cues, errors };
  }

  function merge(cues, offset) {
    const ordered = cues.map(({ start, end }) => ({ start: Math.max(0, start + offset), end: end + offset }))
      .filter(({ end }) => end > 0).sort((a, b) => a.start - b.start || a.end - b.end);
    const union = [];
    for (const range of ordered) {
      const previous = union.at(-1);
      if (previous && range.start <= previous.end) {
        previous.end = Math.max(previous.end, range.end);
      } else {
        union.push(range);
      }
    }
    return union;
  }

  function difference(left, right) {
    const result = [];
    let firstPossible = 0;
    for (const { start, end } of left) {
      let cursor = start;
      while (firstPossible < right.length && right[firstPossible].end <= start) firstPossible++;
      for (let i = firstPossible; i < right.length && right[i].start < end; i++) {
        const peer = right[i];
        if (peer.start > cursor) result.push({ start: cursor, end: peer.start });
        cursor = Math.max(cursor, peer.end);
        if (cursor >= end) break;
      }
      if (cursor < end) result.push({ start: cursor, end });
    }
    return result;
  }

  const total = ranges => ranges.reduce((sum, { start, end }) => sum + end - start, 0);

  function compare(reference, delivery, options = {}) {
    const { minimum = 250, offset = 0 } = options;
    if (![minimum, offset].every(Number.isInteger) || minimum < 0 || minimum > 10000 || Math.abs(offset) > 600000) {
      throw new Error('Minimum gap must be 0–10,000 ms. Offset must be within ±600,000 ms.');
    }
    if (reference.errors.length || delivery.errors.length) throw new Error('Fix the file errors before comparing tracks.');
    if (!reference.cues.length) throw new Error('The reference file has no visible subtitle cues.');
    const source = merge(reference.cues, 0);
    const target = merge(delivery.cues, offset);
    const missing = difference(source, target);
    const extra = difference(target, source);
    const findings = [
      ...missing.map(range => ({ kind: 'missing', ...range })),
      ...extra.map(range => ({ kind: 'extra', ...range })),
    ].filter(range => range.end - range.start >= minimum)
      .sort((a, b) => a.start - b.start || a.end - b.end);
    const sourceMs = total(source);
    const missingMs = total(missing);
    return {
      source, target, sourceMs, targetMs: total(target), matchedMs: sourceMs - missingMs,
      missingMs, extraMs: total(extra), minimum, offset, findings,
      hiddenCount: missing.length + extra.length - findings.length,
      end: Math.max(source.at(-1).end, target.at(-1)?.end ?? 0),
    };
  }

  function time(ms) {
    const hours = Math.floor(ms / 3600000);
    const pad = (n, places = 2) => String(n).padStart(places, '0');
    return (hours ? pad(hours) + ':' : '') + pad(Math.floor(ms / 60000) % 60) + ':' +
      pad(Math.floor(ms / 1000) % 60) + '.' + pad(ms % 1000, 3);
  }

  function csv(report) {
    return 'type,start_ms,end_ms,duration_ms,delivery_offset_ms,minimum_gap_ms\n' +
      report.findings.map(({ kind, start, end }) =>
        [kind, start, end, end - start, report.offset, report.minimum].join(',')).join('\n') +
      (report.findings.length ? '\n' : '');
  }

  return { parse, compare, time, csv };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = CueProof;
</script>
  <script>'use strict';

const byId = id => document.getElementById(id);
let currentReport;
let visibleFindings = 0;
const kindLabel = { missing: '缺少覆盖', extra: '多出覆盖' };
const names = { source: '原稿', delivery: '交付稿' };
const times = CueProof.time;

const demo = {
  source: '1\n00:00:01,000 --> 00:00:05,000\n先把零件放在桌面。\n\n2\n00:00:07,000 --> 00:00:09,000\n核对数量。\n\n3\n00:00:11,000 --> 00:00:13,000\n检查说明书。',
  delivery: 'WEBVTT\n\n00:01.000 --> 00:02.500\nSet the parts\n\n00:02.500 --> 00:05.000\non the table first.\n\n00:07.300 --> 00:09.000\nCheck the quantity.\n\n00:14.000 --> 00:15.000\nNext step.',
};

function status(message, error = false) {
  byId('status').textContent = message;
  byId('status').dataset.error = String(error);
}

async function fileText(file, name) {
  if (file.size > 4 * 1024 * 1024) throw new Error(name + '超过 4 MiB 上限。');
  const bytes = new Uint8Array(await file.arrayBuffer());
  let encoding = 'utf-8';
  if (bytes[0] === 0xff && bytes[1] === 0xfe) encoding = 'utf-16le';
  if (bytes[0] === 0xfe && bytes[1] === 0xff) encoding = 'utf-16be';
  let value;
  try {
    value = new TextDecoder(encoding, { fatal: true }).decode(bytes);
    if (value.includes('\0')) throw new Error('Unexpected NUL');
  } catch {
    throw new Error(name + '的文本编码无法读取，请另存为 UTF-8 后重试。');
  }
  if (/\.vtt$/i.test(file.name) && !/^WEBVTT(?:[\t \r\n]|$)/.test(value)) {
    throw new Error(name + '缺少 WEBVTT 文件标记。');
  }
  return value;
}

function track(id, segments, end, color) {
  const canvas = byId(id);
  const paint = canvas.getContext('2d');
  if (!paint) return;
  paint.clearRect(0, 0, canvas.width, canvas.height);
  paint.fillStyle = color;
  const scale = canvas.width / end;
  for (const segment of segments) {
    paint.fillRect(segment.start * scale, 0, (segment.end - segment.start) * scale, canvas.height);
  }
}

function more() {
  const findings = currentReport.findings;
  const next = findings.slice(visibleFindings, visibleFindings + 100);
  for (const item of next) {
    const row = document.createElement('tr');
    row.className = item.kind;
    for (const value of [kindLabel[item.kind], times(item.start), times(item.end), (item.end - item.start) + ' ms']) {
      const cell = document.createElement('td');
      cell.textContent = value;
      row.append(cell);
    }
    byId('findings').append(row);
  }
  visibleFindings += next.length;
  byId('more').hidden = visibleFindings === findings.length;
  byId('more').textContent = '显示更多（剩余 ' + (findings.length - visibleFindings) + ' 项）';
}

function show(report, example) {
  currentReport = report;
  visibleFindings = 0;
  byId('result-title').textContent = example ? '样例核对结果' : '核对结果';
  const percentage = (100 * report.matchedMs / report.sourceMs).toFixed(1);
  byId('covered').textContent = percentage === '100.0' && report.missingMs ? '>99.9%' : percentage + '%';
  byId('missing').textContent = (report.missingMs / 1000).toFixed(3) + ' s';
  byId('extra').textContent = (report.extraMs / 1000).toFixed(3) + ' s';
  const notes = ['列出时长 ≥ ' + report.minimum + ' ms 的差异。'];
  if (report.hiddenCount) notes.push('有 ' + report.hiddenCount + ' 处短差异仍计入上方统计。');
  if (report.offset) notes.push('交付稿在预览中偏移 ' + report.offset + ' ms。');
  if (!report.findings.length) notes.push('没有达到提示阈值的差异。');
  byId('threshold').textContent = notes.join('');
  byId('track-end').textContent = times(report.end);
  track('source-track', report.source, report.end, '#81e5d2');
  track('delivery-track', report.target, report.end, '#a9bafe');
  byId('findings').replaceChildren();
  more();
  byId('report').hidden = false;
  byId('report').focus({ preventScroll: true });
  byId('report').scrollIntoView({ block: 'nearest' });
}

function compareTexts(input, options, example) {
  const parses = Object.fromEntries(Object.entries(input).map(([side, value]) => [side, CueProof.parse(value)]));
  const problems = Object.entries(parses).flatMap(([side, parsed]) =>
    parsed.errors.map(issue => names[side] + '第 ' + issue.line + ' 行：时间码或分隔符格式有误。'));
  if (problems.length) {
    const list = byId('errors');
    list.replaceChildren(...problems.slice(0, 30).map(problem => {
      const li = document.createElement('li');
      li.textContent = problem;
      return li;
    }));
    list.hidden = false;
    status('发现 ' + problems.length + ' 处格式问题。请修正后重新核对。', true);
    return;
  }
  show(CueProof.compare(parses.source, parses.delivery, options), example);
}

async function run(example) {
  const compare = byId('compare');
  const sample = byId('sample');
  const sourceInput = byId('source');
  const deliveryInput = byId('delivery');
  const options = example ? {} : { minimum: byId('minimum').valueAsNumber, offset: byId('offset').valueAsNumber };
  const controls = [compare, sample, sourceInput, deliveryInput, byId('minimum'), byId('offset')];
  for (const control of controls) control.disabled = true;
  byId('report').hidden = true;
  byId('errors').hidden = true;
  currentReport = undefined;
  status('');
  try {
    if (example) {
      compareTexts(demo, options, true);
      return;
    }
    const [original] = sourceInput.files;
    const [candidate] = deliveryInput.files;
    if (!original || !candidate) throw new Error('请选择原稿和待交付字幕。');
    if (!Number.isInteger(options.minimum) || options.minimum < 0 || options.minimum > 10000 ||
        !Number.isInteger(options.offset) || Math.abs(options.offset) > 600000) {
      throw new Error('提示阈值请输入 0–10,000 毫秒，偏移请输入 ±600,000 毫秒内的整数。');
    }
    const [source, delivery] = await Promise.all([fileText(original, '原稿'), fileText(candidate, '交付稿')]);
    compareTexts({ source, delivery }, options, false);
  } catch (error) {
    status(error.message === 'The reference file has no visible subtitle cues.' ? '原稿里没有可见字幕，无法作为核对基准。' :
      error.message, true);
  } finally {
    for (const control of controls) control.disabled = false;
  }
}

byId('sample').addEventListener('click', () => run(true));
byId('compare').addEventListener('click', () => run(false));
for (const id of ['source', 'delivery', 'minimum', 'offset']) {
  const input = byId(id);
  input.addEventListener(input.type === 'file' ? 'change' : 'input', () => {
    currentReport = undefined;
    byId('report').hidden = true;
    byId('errors').hidden = true;
    status('');
  });
}
byId('more').addEventListener('click', more);
byId('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([CueProof.csv(currentReport)], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'cueproof-timing-report.csv';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
